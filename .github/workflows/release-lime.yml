# Releases @limetech/kompendium from the `lime` branch.
#
# This file only exists on the `lime` branch (and branches cut from it), so it
# never conflicts with upstream. Upstream's own release workflow (release.yml,
# named "CI") is disabled in this fork's Actions settings.
#
# Versioning is independent of upstream: semantic-release only looks at
# `lime-v*` tags (see .releaserc.json), so upstream's `v*` tags are ignored.
#
# npm auth uses OIDC trusted publishing (id-token: write) — no NPM_TOKEN.
name: Release @limetech/kompendium
on:
  push:
    branches:
      - lime
  # Allows sync-upstream.yml to trigger a release after merging upstream,
  # since pushes made with GITHUB_TOKEN do not trigger `push` workflows.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Run Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # When called from sync-upstream.yml the triggering event's SHA is
          # the pre-merge lime head, so check out the branch tip explicitly.
          ref: lime
          # Deliberately a shallow clone: semantic-release runs
          # `git fetch --unshallow` itself, which also fetches the
          # release-channel git notes. With fetch-depth: 0 that fetch fails
          # silently and the notes go missing.
      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
